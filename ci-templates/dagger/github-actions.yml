# Renovate via the Dagger module on GitHub Actions.
# Copy to .github/workflows/renovate-dagger.yml. Same secrets/variables as
# ci-templates/github-actions/renovate.yml.
name: Renovate (Dagger)

on:
  schedule:
    - cron: "17 5 * * 1-5"
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: dagger/dagger-for-github@v8.4.1
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          # renovate: datasource=github-releases depName=dagger/dagger
          version: v0.21.11
          module: ./dagger
          call: >-
            run
            --token=env://RENOVATE_TOKEN
            --platform=github
            --repositories=${{ github.repository }}
