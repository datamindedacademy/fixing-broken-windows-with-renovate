# Renovate via the Dagger module on GitLab CI (Docker-in-Docker runner).
# Same CI/CD variables as ci-templates/gitlab-ci/.gitlab-ci.yml.
renovate:
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
    # renovate: datasource=github-releases depName=dagger/dagger
    DAGGER_VERSION: v0.21.11
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  resource_group: renovate
  before_script:
    - apk add --no-cache curl
    - curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=/usr/local/bin sh
  script:
    - >-
      dagger call -m ./dagger run
      --token=env://RENOVATE_TOKEN
      --github-com-token=env://RENOVATE_GITHUB_COM_TOKEN
      --platform=gitlab
      --endpoint="$CI_API_V4_URL"
      --autodiscover
      --autodiscover-filter="$CI_PROJECT_NAMESPACE/*"
